[workspace]
resolver = "3"
members = ["crates/oxibit-bitstream", "crates/oxibit-fasm", "crates/oxibit-hdl", "crates/oxibit-synth", "crates/oxibit-cec", "crates/oxibit-prof", "crates/oxibit-prof-macros", "crates/oxibit-guard", "crates/oxibit-zynq7", "crates/oxibit-pnr", "crates/oxibit-place", "crates/oxibit-report", "crates/oxibit-timing", "crates/oxibit-nexus", "crates/oxibit-ecp5", "crates/oxibit-arch", "crates/oxibit-policy", "crates/oxibit"]
# oxibit-sta (main's first timer) reads pnr::placed::Import fields the
# lutperm line dropped (cells, sink_pins, driver_pins); pnr::sta is the
# timer now. Out of the build until it is ported or retired.
exclude = ["crates/oxibit-sta"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
oxibit-bitstream = { path = "crates/oxibit-bitstream" }
oxibit-fasm = { path = "crates/oxibit-fasm" }
oxibit-pnr = { path = "crates/oxibit-pnr" }
oxibit-place = { path = "crates/oxibit-place" }
oxibit-report = { path = "crates/oxibit-report" }
oxibit-timing = { path = "crates/oxibit-timing" }
oxibit-guard = { path = "crates/oxibit-guard" }
oxibit-zynq7 = { path = "crates/oxibit-zynq7" }
oxibit-prof = { path = "crates/oxibit-prof" }
oxibit-nexus = { path = "crates/oxibit-nexus" }
oxibit-ecp5 = { path = "crates/oxibit-ecp5" }
oxibit-sta = { path = "crates/oxibit-sta" }
oxibit-policy = { path = "crates/oxibit-policy" }
tracing = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
flate2 = "1"
# Pure-Rust libm: exp / pow / log with the same bits on every platform (the
# system libm differs between macOS and glibc, which moved placements).
libm = "0.2"

[profile.release]
# A panic ends the process. For `oxibit port` the BEAM's contract is the exit
# status; unwinding with a live /dev/mem mapping has nothing to offer.
panic = "abort"
strip = true
# Whole-program optimisation. The router is the hot path and crosses crate
# boundaries constantly (oxibit-pnr -> oxibit-fabric lookups); fat LTO with a
# single codegen unit lets those inline. Costs build time, not correctness.
lto = "fat"
codegen-units = 1

# Release with line tables and symbols, for samply/perf stacks.
#   cargo build --profile profiling [--features profile]
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# Lints from BeautifulRust (github.com/morganlinton/BeautifulRust, lints/lints.toml @ b971843).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"          # each unsafe op needs its own unsafe block
missing_debug_implementations = "warn"   # every public type implements Debug
missing_docs = "allow"                   # oxibit: unpublished workspace (publish = false)
unreachable_pub = "warn"                 # pub items that aren't actually exported
rust_2018_idioms = { level = "warn", priority = -1 } # 2018-edition idioms, e.g. Formatter<'_>

[workspace.lints.clippy]
# Groups first, at lower priority so the individual settings below win.
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }

# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "warn"                     # use ?, or expect("why this cannot fail")
expect_used = "allow"                    # expect with a reason is the sanctioned form
panic_in_result_fn = "warn"              # a fn returning Result shouldn't also panic
missing_panics_doc = "allow"             # oxibit: unpublished workspace
missing_errors_doc = "allow"             # oxibit: unpublished workspace
missing_assert_message = "warn"          # assert! says what went wrong (quiet inside #[test])

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "warn"                # prefer #[expect] over #[allow] (needs rust-version 1.81+)
allow_attributes_without_reason = "warn" # every suppression says why (needs rust-version 1.81+)

# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"      # // SAFETY: comment on every unsafe block
multiple_unsafe_ops_per_block = "warn"   # one unsafe operation per block

# API shape.
fn_params_excessive_bools = "warn"       # bool parameters: use an enum or two methods
struct_excessive_bools = "warn"          # many bool fields: use an enum or bitflags
clone_on_ref_ptr = "warn"                # write Rc::clone(&x) so cheap clones are visible
redundant_clone = "warn"                 # a clone whose original is never used again
rc_buffer = "warn"                       # Rc<String> / Rc<Vec<T>>: use Rc<str> / Rc<[T]>

# Evolution.
exhaustive_enums = "allow"               # oxibit: unpublished; opcode/primitive enums are closed sets

# Idioms.
string_add = "warn"                      # build strings with format! or push_str, not +
wildcard_imports = "warn"                # no glob imports (use super::* in tests is allowed)

# Output and debugging leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"                    # [lib] libraries log, they don't print
print_stderr = "warn"                    # [lib] libraries log, they don't print

# Casts that silently lose information.
as_conversions = "allow"                 # oxibit: bitstream, frame and register code casts by design
cast_possible_truncation = "allow"       # oxibit: bit-field packing; revisit per module
cast_sign_loss = "allow"                 # oxibit: bit-field packing; revisit per module

# Pedantic lints that are mostly noise in practice, or that the skill disagrees with.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"               # a leaf module named after its main item is fine
enum_glob_use = "allow"                  # use Enum::* inside a function that matches on it

# oxibit tailoring: pedantic lints that fire on deliberate idioms in this codebase.
cast_lossless = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
unreadable_literal = "allow"              # bit patterns and frame addresses
doc_markdown = "allow"
many_single_char_names = "allow"          # placer and timing math
similar_names = "allow"
too_many_lines = "allow"

# `all` at priority -1 demotes clippy's deny-by-default correctness group to warn;
# restore it so a correctness lint fails a local build, not only CI.
correctness = { level = "deny", priority = -1 }
