# ULX3S v3 onboard FT231X, bit-banged JTAG (pin map from emard ulx3s-misc).
# trst / srst must be assigned: the ft232r defaults put them on pins this
# map uses for TMS / TDO, and the chain then reads all ones. No reset is
# issued, so a scan does not disturb the running design.
adapter driver ft232r
adapter speed 1000
ft232r vid_pid 0x0403 0x6015
ft232r tck_num DSR
ft232r tms_num DCD
ft232r tdi_num RI
ft232r tdo_num CTS
ft232r trst_num RTS
ft232r srst_num DTR
transport select jtag
jtag newtap ecp5 tap -irlen 8 -expected-id 0x41113043
pld create ecp5.pld lattice -chain-position ecp5.tap
