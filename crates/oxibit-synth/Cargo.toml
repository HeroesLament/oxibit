[package]
name = "oxibit-synth"
description = "Synthesis for oxibit: word-level netlist to xc7 LUT / flop / primitive netlist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxibit-hdl = { path = "../oxibit-hdl" }
serde_json.workspace = true
oxibit-prof.workspace = true
oxibit-report.workspace = true
tracing = { workspace = true, optional = true }

[features]
profile = ["dep:tracing", "oxibit-prof/profile", "oxibit-hdl/profile"]
