[package]
name = "oxibit"
description = "Xilinx bitstream inspection, conversion and verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
oxibit-bitstream.workspace = true
oxibit-ecp5.workspace = true
oxibit-nexus.workspace = true
oxibit-place.workspace = true
oxibit-synth = { path = "../oxibit-synth" }
oxibit-hdl = { path = "../oxibit-hdl" }
oxibit-fasm.workspace = true
oxibit-pnr.workspace = true
oxibit-report.workspace = true
oxibit-timing.workspace = true
libc.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
oxibit-guard.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oxibit-zynq7.workspace = true

[lints]
workspace = true

[features]
default = []
# Compile the built-in ECP5 chip data in (`--chip-data builtin`); large.
builtin-ecp5 = ["oxibit-ecp5/builtin-data"]
