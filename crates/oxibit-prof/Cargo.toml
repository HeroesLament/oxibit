[package]
name = "oxibit-prof"
description = "Profiling for oxibit: #[hot] spans, and flamegraph, Perfetto and table output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Turns on the collectors. A crate using #[hot] has its own `profile`
# feature that enables `tracing` for itself and this one.
profile = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-flame", "dep:tracing-chrome", "dep:inferno"]

[dependencies]
oxibit-prof-macros = { path = "../oxibit-prof-macros" }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }
tracing-flame = { version = "0.2", optional = true }
tracing-chrome = { version = "0.7", optional = true }
inferno = { version = "0.12", optional = true, default-features = false }
