[package]
name = "oxibit-prof-macros"
description = "#[hot]: a tracing span on a function, compiled in only with the crate's `profile` feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
